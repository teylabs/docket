name: run-tests

on:
  push:
    branches: [main, '*.x']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: P${{ matrix.php }} - L${{ matrix.laravel }} - ${{ matrix.stability }} - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        php: ['8.4', '8.3']
        laravel: ['13.*', '12.*']
        stability: [prefer-lowest, prefer-stable]
        include:
          - laravel: '13.*'
            testbench: '11.*'
          - laravel: '12.*'
            testbench: '^10.6'
          # Mirror Mod: PHP 8.5 uses stable dependencies only.
          - os: ubuntu-latest
            php: '8.5'
            laravel: '13.*'
            stability: prefer-stable
            testbench: '11.*'
          - os: ubuntu-latest
            php: '8.5'
            laravel: '12.*'
            stability: prefer-stable
            testbench: '^10.6'
          - os: windows-latest
            php: '8.5'
            laravel: '13.*'
            stability: prefer-stable
            testbench: '11.*'
          - os: windows-latest
            php: '8.5'
            laravel: '12.*'
            stability: prefer-stable
            testbench: '^10.6'

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pdo_sqlite, intl, fileinfo
          tools: composer:v2
          coverage: none

      - name: Setup problem matchers
        shell: bash
        run: |
          echo "::add-matcher::${{ runner.tool_cache }}/php.json"
          echo "::add-matcher::${{ runner.tool_cache }}/phpunit.json"

      - name: Install dependencies
        shell: bash
        run: |
          composer require "laravel/framework:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}" "nesbot/carbon:^3.8.4" "pestphp/pest:^4.0" "pestphp/pest-plugin-laravel:^4.0" --no-interaction --no-update
          composer update --${{ matrix.stability }} --prefer-dist --no-interaction

      - name: List installed dependencies
        shell: bash
        run: composer show --direct

      - name: Execute tests
        run: composer test -- --ci

  postgres:
    # PostgreSQL behind a transaction pooler (emulated prepares): an integer bound against the string subject_id/initiator_id columns is an error there.
    name: PostgreSQL (emulated prepares) - run lookups
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: docket_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: dom, curl, libxml, mbstring, zip, pdo_sqlite, pdo_pgsql, intl, fileinfo
          tools: composer:v2
          coverage: none

      - name: Install dependencies
        run: composer update --prefer-stable --prefer-dist --no-interaction

      - name: Run the run-lookup tests on PostgreSQL
        env:
          DOCKET_TEST_PGSQL_DATABASE: docket_test
          DOCKET_TEST_PGSQL_PASSWORD: postgres
        run: vendor/bin/pest --ci tests/Feature/RunTest.php
