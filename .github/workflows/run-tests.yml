name: run-tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: P${{ matrix.php }} - L${{ matrix.laravel }} - ${{ matrix.stability }} - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        php: ['8.4', '8.3']
        laravel: ['13.*', '12.*']
        stability: [prefer-lowest, prefer-stable]
        include:
          - laravel: '13.*'
            testbench: '11.*'
          - laravel: '12.*'
            testbench: '^10.6'
          # Mirror Mod: PHP 8.5 uses stable dependencies only.
          - os: ubuntu-latest
            php: '8.5'
            laravel: '13.*'
            stability: prefer-stable
            testbench: '11.*'
          - os: ubuntu-latest
            php: '8.5'
            laravel: '12.*'
            stability: prefer-stable
            testbench: '^10.6'
          - os: windows-latest
            php: '8.5'
            laravel: '13.*'
            stability: prefer-stable
            testbench: '11.*'
          - os: windows-latest
            php: '8.5'
            laravel: '12.*'
            stability: prefer-stable
            testbench: '^10.6'

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pdo_sqlite, intl
          tools: composer:v2
          coverage: none

      - name: Setup problem matchers
        shell: bash
        run: |
          echo "::add-matcher::${{ runner.tool_cache }}/php.json"
          echo "::add-matcher::${{ runner.tool_cache }}/phpunit.json"

      - name: Install dependencies
        shell: bash
        run: |
          composer require "laravel/framework:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}" "nesbot/carbon:^3.8.4" "pestphp/pest:^4.0" "pestphp/pest-plugin-laravel:^4.0" --no-interaction --no-update
          composer update --${{ matrix.stability }} --prefer-dist --no-interaction

      - name: List installed dependencies
        shell: bash
        run: composer show --direct

      - name: Execute tests
        run: composer test -- --ci
