name: Bug Report
description: Report a reproducible bug in the package.
title: '[Bug]: '
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What Happened?
      description: Describe the expected and actual behaviour. Do not include secrets or private project details.
    validations:
      required: true
  - type: textarea
    id: how-to-reproduce
    attributes:
      label: How to Reproduce
      description: Provide the steps and configuration needed to reproduce the bug.
    validations:
      required: true
  - type: input
    id: package-version
    attributes:
      label: Package Version or Commit
      description: The Docket version (or commit) you tested.
    validations:
      required: true
  - type: input
    id: php-version
    attributes:
      label: PHP Version
    validations:
      required: true
  - type: input
    id: laravel-version
    attributes:
      label: Laravel Version
    validations:
      required: true
  - type: dropdown
    id: operating-systems
    attributes:
      label: Operating Systems
      multiple: true
      options:
        - macOS
        - Windows
        - Linux
